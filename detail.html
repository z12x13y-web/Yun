<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>影片详情 · 云影视</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="detail" class="theme-light">

<section class="player">
  <div class="player__stage">
    <div class="player__glow" aria-hidden="true"></div>
    <div class="player__bar">
      <button class="icon-btn icon-btn--ghost" type="button" onclick="history.back()" aria-label="返回">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="player__title" id="dPlayerTitle">正在播放</span>
      <button class="icon-btn icon-btn--ghost" type="button" aria-label="听音">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0116 0v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="2.5" y="13.5" width="4" height="6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="17.5" y="13.5" width="4" height="6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      </button>
    </div>
    <span class="player__res">3840 × 2160</span>
    <button class="player__play" type="button" aria-label="播放">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>
    </button>
    <div class="player__controls">
      <button class="icon-btn icon-btn--ghost" type="button" aria-label="上一集">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14L8 12z" fill="currentColor"/><rect x="5" y="5" width="2" height="14" fill="currentColor"/></svg>
      </button>
      <span class="player__time">00:10</span>
      <span class="player__progress"><i></i></span>
      <span class="player__time">46:20</span>
      <button class="icon-btn icon-btn--ghost" type="button" aria-label="全屏">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</section>

<section class="detail">
  <div class="tabs">
    <button class="tab is-on" type="button">影视</button>
    <button class="tab" type="button">影评</button>
    <button class="icon-btn tabs__right" type="button" aria-label="剧集">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 9h6M9 13h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="detail__head">
    <h1 class="detail__title" id="dTitle">影片</h1>
    <button class="detail__score" type="button">评分 <span id="dScore">--</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="chips" id="dTags"></div>
  <p class="detail__intro" id="dIntro"></p>

  <div class="actions">
    <button class="action" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 21h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8 10h8M8 13.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>弹幕</span>
    </button>
    <button class="action" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8 11l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 19h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>缓存</span>
    </button>
    <button class="action" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-9.2A4 4 0 0112 8a4 4 0 017 2.8C19 15.6 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>收藏</span>
    </button>
    <button class="action" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M17 10l4-2.5v9L17 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>投屏</span>
    </button>
  </div>

  <div class="block__head">
    <h2 class="block__title">播放源</h2>
    <button class="linkish" type="button">源排序</button>
    <button class="linkish linkish--right" type="button">更多
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="sources" id="dSources"></div>

  <div class="block__head">
    <h2 class="block__title">选集</h2>
    <button class="linkish" type="button">正序
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M12 19l-4-4M12 19l4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="linkish linkish--right" type="button" id="dEpCount">更新至 0 集
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="episodes" id="dEps"></div>
</section>

<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
