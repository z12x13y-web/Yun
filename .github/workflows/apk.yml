name: 打包 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - "fetch.py"
      - ".github/workflows/apk.yml"

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 抓取首页数据
        run: python3 fetch.py || true

      - name: 网页放进 assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -f index.html home.css home.js detail.html style.css app.js demo.js data.json android/app/src/main/assets/
          ls -l android/app/src/main/assets

      - name: 构建 APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: 收集产物
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/Yun.apk
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: Yun-apk
          path: out/*.apk

      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest --title "Yun APK" --notes "自动构建的安装包" || true
          gh release upload apk-latest out/*.apk --clobber
